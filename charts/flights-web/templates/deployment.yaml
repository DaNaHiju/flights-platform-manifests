apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flights-web.fullname" . }}
  labels:
    {{- include "flights-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flights-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flights-web.labels" . | nindent 8 }}
        version: {{ .Values.version | quote }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flights-web.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # `/` serves index.html: it answers only if nginx is up and the
          # static files are in the image.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The root filesystem is read-only. nginx-unprivileged writes its pid
          # file and every temp dir (client body, proxy, fastcgi, uwsgi, scgi)
          # under /tmp, so that is the only writable path it needs.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
