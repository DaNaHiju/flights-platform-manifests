image:
  repository: ghcr.io/danahiju/flights-worker
  tag: "sha-07b4382"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  restartPolicy: OnFailure

podAnnotations: {}

serviceAccount:
  create: false
  # Defaults to flights-worker.fullname when create is true, "default" otherwise.
  name: ""
  annotations: {}
  # Rendered on the ServiceAccount; the referenced Secrets must already exist.
  imagePullSecrets: []

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Plain env vars, rendered sorted into the container's env.
# No DATABASE_URL — the worker does not touch Postgres.
# REDIS_URL is set per environment (it points at the flights-api release's Redis).
config:
  APP_NAME: flights-worker
  LOG_LEVEL: INFO

# Amadeus API key for the deals refresh. The worker does not own the secret:
# it reads the one flights-api's ExternalSecret writes in the same namespace.
# Empty: no AMADEUS_API_KEY env (the job then keeps the previous deals).
amadeus:
  existingSecret: ""

# Pod scheduling. Empty by default (homelab); EKS pins workloads to the tainted
# `app` node group (see values-eks.yaml).
nodeSelector: {}
tolerations: []
