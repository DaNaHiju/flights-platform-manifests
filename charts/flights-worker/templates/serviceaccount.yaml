{{- $sa := .Values.serviceAccount | default dict }}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flights-worker.serviceAccountName" . }}
  labels:
    {{- include "flights-worker.labels" . | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $sa.imagePullSecrets }}
# Pods using this ServiceAccount inherit these pull secrets, so the CronJob's
# pod spec does not list them itself. The Secrets are NOT created by this chart.
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
