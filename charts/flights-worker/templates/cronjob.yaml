apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "flights-worker.fullname" . }}
  labels:
    {{- include "flights-worker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "flights-worker.labels" . | nindent 8 }}
    spec:
      template:
        metadata:
          labels:
            {{- include "flights-worker.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "flights-worker.serviceAccountName" . }}
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # No command/args: the image's Dockerfile CMD is the entrypoint.
              env:
                {{- range $key := keys .Values.config | sortAlpha }}
                - name: {{ $key }}
                  value: {{ get $.Values.config $key | quote }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
