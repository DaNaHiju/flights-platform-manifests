config:
  ENVIRONMENT: staging
  # Not a secret: internal hostname, no credential (staging Redis has auth off).
  # MUST match what the flights-api.redisUrl helper composes for the
  # "flights-api-staging" release: "<release>-redis-master" on port 6379, db 0.
  # Values files cannot call another chart's helpers, so this is hardcoded.
  REDIS_URL: "redis://flights-api-staging-redis-master:6379/0"

serviceAccount:
  create: true
  imagePullSecrets:
    - name: ghcr-pull

# Excluded from the mesh for a different reason than Postgres/Redis (those are
# protocol/clustering): a CronJob's sidecar never exits when the main
# container finishes, so the Job would hang short of Completed. Not worth
# solving for a short-lived scheduled task with no inbound traffic.
podAnnotations:
  sidecar.istio.io/inject: "false"
