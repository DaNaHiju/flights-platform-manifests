{{- if .Values.pixabay.enabled }}
# Pixabay API key for flights-api (destination photos). Separate from the DB and
# Amadeus ExternalSecrets on purpose: it comes from the homelab-secrets store
# (a real secret cannot live in fake-local, whose values are in Git), and its
# absence must not break the database credentials or flight search.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "flights-api.fullname" . }}-pixabay
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pixabay.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.pixabay.externalSecret.storeName }}
  target:
    # Mounted by deployment.yaml (envFrom, optional). Renaming it breaks that.
    name: {{ include "flights-api.fullname" . }}-pixabay
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PIXABAY_API_KEY
      remoteRef:
        key: {{ .Values.pixabay.externalSecret.remoteKey | quote }}
        {{- with .Values.pixabay.externalSecret.remoteProperty }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
