{{- $sa := .Values.serviceAccount | default dict }}
{{- if $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flights-api.serviceAccountName" . }}
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
