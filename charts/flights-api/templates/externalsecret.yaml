{{- if .Values.externalSecrets.enabled }}
# Rendered only when externalSecrets.enabled is true (staging against the fake
# store, production against AWS Secrets Manager). Replaces the static secret.yaml:
# External Secrets Operator reads the DB credentials from the ClusterSecretStore
# named by .Values.externalSecrets.storeName and writes a Secret whose name MUST
# equal the Deployment's envFrom secretRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "flights-api.fullname" . }}
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    # MUST stay equal to include "flights-api.fullname" — deployment.yaml mounts
    # this Secret by that name via envFrom.secretRef, and the postgresql subchart
    # reads it via auth.existingSecret. A different name here and both break.
    # deployment.yaml is not touched.
    name: {{ include "flights-api.fullname" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "flights-api.labels" . | nindent 10 }}
      data:
        # RHS is Go templating evaluated by ESO against the remoteRef values
        # fetched below — NOT by Helm. The backtick raw strings in this template
        # stop Helm from evaluating those ESO placeholder tokens itself.
        DB_USER: {{ `{{ .DB_USER }}` | quote }}
        DB_PASSWORD: {{ `{{ .DB_PASSWORD }}` | quote }}
        # Same DATABASE_URL composition secret.yaml performs today: host from the
        # flights-api.postgresqlHost helper, port and name from config values.
        #
        # TODO(terraform): the random_password backing this secret in AWS Secrets
        # Manager MUST set override_special to exclude URL-reserved characters
        # (@ : / # ? [ ] and similar) so DATABASE_URL stays parseable. We do NOT
        # percent-encode at consumption here — encoding a correctly-generated
        # password would double-encode it. (The staging fake fixture value is
        # hand-picked to already be URL-safe.)
        DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s" `{{ .DB_USER }}` `{{ .DB_PASSWORD }}` (include "flights-api.postgresqlHost" .) (.Values.config.DB_PORT | toString) .Values.config.DB_NAME | quote }}
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.dbUser | quote }}
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.dbPassword | quote }}
{{- end }}
