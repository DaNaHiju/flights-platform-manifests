apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flights-api.fullname" . }}
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flights-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flights-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "flights-api.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "flights-api.fullname" . }}
            - secretRef:
                name: {{ include "flights-api.fullname" . }}
            {{- if .Values.amadeus.enabled }}
            # AMADEUS_API_KEY. optional: a missing key degrades search to 503,
            # it does not stop the pod (health, bookings, deals keep working).
            # envFrom is read at container start: after rotating the key, restart
            # the pods to pick it up.
            - secretRef:
                name: {{ include "flights-api.fullname" . }}-amadeus
                optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
