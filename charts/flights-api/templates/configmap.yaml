apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flights-api.fullname" . }}
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
data:
  {{- $resolved := merge (dict "DB_HOST" (include "flights-api.postgresqlHost" .) "REDIS_URL" (include "flights-api.redisUrl" .)) .Values.config }}
  {{- range $key := keys $resolved | sortAlpha }}
  {{ $key }}: {{ get $resolved $key | quote }}
  {{- end }}
