{{- if .Values.amadeus.enabled }}
# Amadeus Travel Builder API key for flights-api (and the worker, which reads
# the same Secret by name). Separate from the DB ExternalSecret on purpose: it
# comes from a different store (a real secret cannot live in fake-local, whose
# values are in Git), and its absence must not break the database credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "flights-api.fullname" . }}-amadeus
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.amadeus.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.amadeus.externalSecret.storeName }}
  target:
    # Mounted by deployment.yaml (envFrom, optional) and by the flights-worker
    # chart (amadeus.existingSecret). Renaming it breaks both.
    name: {{ include "flights-api.fullname" . }}-amadeus
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AMADEUS_API_KEY
      remoteRef:
        key: {{ .Values.amadeus.externalSecret.remoteKey | quote }}
        {{- with .Values.amadeus.externalSecret.remoteProperty }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
