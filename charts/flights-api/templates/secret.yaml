# NOTE: this Secret is a placeholder for local development only.
# Staging and production DB_USER/DB_PASSWORD values must be supplied by the
# External Secrets Operator, backed by AWS Secrets Manager — not committed as
# plaintext in this chart's values files.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flights-api.fullname" . }}
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.secrets.DB_USER | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | b64enc | quote }}
