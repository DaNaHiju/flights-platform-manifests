apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flights-api.fullname" . }}
  labels:
    {{- include "flights-api.labels" . | nindent 4 }}
type: Opaque
data:
  # Placeholder credentials for local/staging development only.
  # In production these come from External Secrets Operator backed by
  # AWS Secrets Manager, and this template is not rendered.
  DB_USER: {{ .Values.secrets.DB_USER | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | b64enc | quote }}
  # The application reads a single DATABASE_URL (see app/config.py); it does not
  # compose one from DB_HOST/DB_PORT/DB_NAME. Built here rather than in the
  # ConfigMap because it embeds the password.
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s"
      .Values.secrets.DB_USER
      .Values.secrets.DB_PASSWORD
      (include "flights-api.postgresqlHost" .)
      (.Values.config.DB_PORT | toString)
      .Values.config.DB_NAME
    | b64enc | quote }}
