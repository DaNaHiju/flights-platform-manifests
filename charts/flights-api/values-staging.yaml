image:
  tag: "0.1.0"

serviceAccount:
  # Created by hand per namespace (bootstrap) — see CLAUDE.md, "ghcr-pull".
  imagePullSecrets:
    - name: ghcr-pull

config:
  ENVIRONMENT: staging
  DB_HOST: flights-api-postgresql
  REDIS_URL: redis://flights-api-redis-master:6379/0

postgresql:
  enabled: true
  primary:
    # Excluded from the mesh: Postgres speaks its own wire protocol and
    # already has its own transport security; a sidecar adds nothing here
    # and complicates startup ordering for no benefit.
    podAnnotations:
      sidecar.istio.io/inject: "false"
  auth:
    database: flights
    username: flights
    # MUST equal flights-api.fullname for the staging release. Values files
    # cannot call chart helpers, so this is hardcoded: the ArgoCD ApplicationSet
    # names the release "flights-api-staging", and because the chart name
    # "flights-api" is contained in that release name, fullname renders it
    # verbatim. Changing nameOverride / fullnameOverride or the release name
    # breaks BOTH this subchart lookup and the Deployment's envFrom secretRef.
    existingSecret: flights-api-staging
    # false: the StatefulSet then needs only DB_PASSWORD from the secret above.
    # The ESO-owned Secret carries no postgres-password / admin key, and the
    # "postgres" superuser gets no remote password (unused by this app).
    enablePostgresUser: false
    secretKeys:
      userPasswordKey: DB_PASSWORD
    # ORDERING: this Secret is created by the ExternalSecret (ESO). It must exist
    # before the postgres StatefulSet pod starts; until then the pod backs off
    # and retries. ESO reconciles the fake store in seconds, so it converges with
    # no manual step.

redis:
  enabled: true
  # Excluded from the mesh: Redis replication is its own protocol and the
  # master/replicas already cluster directly with each other; a sidecar adds
  # nothing here and complicates startup ordering for no benefit.
  master:
    podAnnotations:
      sidecar.istio.io/inject: "false"
  replica:
    podAnnotations:
      sidecar.istio.io/inject: "false"

# Assignment 5.1: the ExternalSecret -> Secret -> envFrom chain is exercised in
# staging too, not only production. k3s has no EKS OIDC provider, so IRSA and the
# AWS store cannot work here — the ESO fake provider stands in.
externalSecrets:
  enabled: true
  storeName: fake-local
  remoteKeys:
    dbUser: flights-api/db-user
    dbPassword: flights-api/db-password
