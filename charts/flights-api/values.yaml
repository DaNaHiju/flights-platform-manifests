replicaCount: 1

image:
  repository: ghcr.io/danahiju/flights-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  # Defaults to flights-api.fullname when create is true, "default" otherwise.
  name: ""
  # Rendered on the ServiceAccount; the referenced Secrets must already exist.
  imagePullSecrets: []

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10

config:
  LOG_LEVEL: INFO
  FLIGHTS_CURRENCY: USD
  FLIGHTS_DEFAULT_ORIGIN: TLV
  SEARCH_CACHE_TTL: "600"
  DB_PORT: "5432"
  DB_NAME: flights

postgresql:
  enabled: true
  auth:
    database: flights
    username: flights
    password: changeme-local-only

redis:
  enabled: true
  auth:
    enabled: false

# Local/staging placeholder credentials. Consumed by secret.yaml, which only
# renders while externalSecrets.enabled is false.
secrets:
  DB_USER: flights
  DB_PASSWORD: changeme-local-only

externalSecrets:
  # false: secret.yaml renders the Secret from the placeholders above.
  # true:  externalsecret.yaml renders an ExternalSecret and ESO owns the Secret.
  enabled: false
  refreshInterval: 1h
  # Which ClusterSecretStore to read from. Homelab validation uses the ESO fake
  # provider; EKS uses aws-secrets-manager.
  # See argocd/platform-infra/clustersecretstores.
  storeName: fake-local
  # Key paths within the selected store.
  remoteKeys:
    dbUser: flights-api/db-user
    dbPassword: flights-api/db-password
  # Optional JSON property inside the remote secret. Empty: the whole value is
  # used (one secret per field). Set when one secret holds both fields as JSON
  # (EKS: Secrets Manager secret flights/eks/db with keys DB_USER, DB_PASSWORD).
  remoteProperties:
    dbUser: ""
    dbPassword: ""

# Flight data provider: Amadeus Travel Builder APIs. Off by default, so an
# environment opts in explicitly; values-staging.yaml enables it. Production
# keeps rendering exactly what it rendered before this block existed.
amadeus:
  enabled: false
  # Where the API key comes from. ESO writes it into the Secret
  # "<fullname>-amadeus" (key AMADEUS_API_KEY), mounted with optional: true:
  # without it the pod still starts and searches answer 503
  # provider_not_configured instead of the pod failing to start.
  externalSecret:
    storeName: homelab-secrets
    remoteKey: flights-amadeus
    remoteProperty: api-key
    refreshInterval: 1h

# Destination photos: Pixabay API. Off by default, like "amadeus": an
# environment opts in explicitly; values-staging.yaml enables it. Production
# and EKS keep rendering exactly what they rendered before this block existed.
pixabay:
  enabled: false
  # ESO writes the key into the Secret "<fullname>-pixabay" (key
  # PIXABAY_API_KEY), mounted with optional: true: without it the pod still
  # starts and GET /destination-image answers {"available": false}.
  externalSecret:
    storeName: homelab-secrets
    remoteKey: flights-pixabay
    remoteProperty: api-key
    refreshInterval: 1h

istio:
  # Sidecar CRD (config scoping), not sidecar injection. When enabled, ships a
  # networking.istio.io Sidecar that limits the mesh config istiod pushes to the
  # flights-api proxies. Off by default; enabled in production.
  sidecarScope:
    enabled: false

# Pod scheduling. Empty by default (homelab); EKS pins workloads to the tainted
# `app` node group (see values-eks.yaml).
nodeSelector: {}
tolerations: []
