# Default StorageClass on EKS: gp3 volumes through the EBS CSI driver add-on
# (installed by Terraform). WaitForFirstConsumer creates the volume in the AZ of
# the node the pod lands on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
