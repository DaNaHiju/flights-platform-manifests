# The only public entry point. The AWS Load Balancer Controller turns this Ingress
# into an internet-facing ALB whose targets are the Istio ingress gateway pod IPs
# (ALB -> Istio ingress gateway -> Gateway/VirtualService -> flights-web).
# The ALB is created at runtime, NOT by Terraform: see DESTROY.md in the infra repo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: istio-ingressgateway
  namespace: istio-system
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: flights-dev
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # The gateway's readiness endpoint, not the traffic port.
    alb.ingress.kubernetes.io/healthcheck-port: "15021"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
