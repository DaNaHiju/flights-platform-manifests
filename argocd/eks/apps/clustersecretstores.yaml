apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clustersecretstores
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the ESO CRDs (wave -2), before any workload.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform-infra
  source:
    repoURL: https://github.com/DaNaHiju/flights-platform-manifests.git
    targetRevision: main
    path: argocd/platform-infra/clustersecretstores
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # EKS: only the AWS store, and without the jwt block, so ESO uses the
        # identity of its controller pod (EKS Pod Identity, not IRSA).
        - name: fake.enabled
          value: "false"
        - name: aws.serviceAccountAuth
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
