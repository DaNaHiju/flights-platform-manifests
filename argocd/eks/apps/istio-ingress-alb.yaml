apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress-alb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the gateway (0) and the LB controller (-2).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-infra
  source:
    repoURL: https://github.com/DaNaHiju/flights-platform-manifests.git
    targetRevision: main
    path: argocd/eks/platform/ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
