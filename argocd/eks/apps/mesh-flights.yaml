apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-flights
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-apps
  source:
    repoURL: https://github.com/DaNaHiju/flights-platform-manifests.git
    targetRevision: main
    path: argocd/eks/mesh
  destination:
    server: https://kubernetes.default.svc
    namespace: flights
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
