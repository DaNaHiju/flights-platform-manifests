apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Same wave as istio-base: this Application ships CRDs that later waves
    # (ClusterSecretStores, then ExternalSecrets) depend on.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform-infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        valueFiles:
          - $values/infra/helm-values/external-secrets.yaml
    - repoURL: https://github.com/DaNaHiju/flights-platform-manifests.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Same reason istio-base needs it: large CRD schemas and multiple field
      # managers cause client-side-apply conflicts.
      - ServerSideApply=true
