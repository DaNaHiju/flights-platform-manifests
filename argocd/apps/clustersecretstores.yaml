apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clustersecretstores
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the ESO CRDs (wave -2), before any workload.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform-infra
  source:
    repoURL: https://github.com/DaNaHiju/flights-platform-manifests.git
    targetRevision: main
    path: argocd/platform-infra/clustersecretstores
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # This Application targets the k3s homelab (in-cluster). IRSA cannot work
        # here, so the AWS store would sit permanently NotReady. The chart keeps
        # aws.enabled=true by default for the eventual EKS Application.
        - name: aws.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
