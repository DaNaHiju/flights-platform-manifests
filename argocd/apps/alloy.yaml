apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Needs https://grafana.github.io/helm-charts in platform-infra sourceRepos
  # (see branch feat/platform-infra-chart-repos).
  project: platform-infra
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.0
      helm:
        # releaseName fixes the Service/resource names: kept explicit so the ClusterRole/DaemonSet names stay stable.
        releaseName: alloy
        valueFiles:
          - $values/infra/helm-values/alloy.yaml
    - repoURL: https://github.com/DaNaHiju/flights-platform-manifests.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
