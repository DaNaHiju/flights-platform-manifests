{{- if .Values.aws.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # On a first sync the external-secrets.io CRDs may not be registered yet when
    # ArgoCD runs its dry-run; without this the sync fails on a resource that
    # would be valid one wave later.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region | quote }}
      auth:
        # IRSA — no static credentials (assignment 6.3). ESO reads the
        # eks.amazonaws.com/role-arn annotation off this ServiceAccount, which is
        # the ESO controller SA created by argocd/apps/external-secrets.yaml.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- end }}
