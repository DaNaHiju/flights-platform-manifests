{{- if .Values.kubernetes.enabled }}
# HOMELAB STORE FOR REAL SECRETS THAT MUST NOT LIVE IN GIT.
#
# The fake-local store keeps its values in this repo, so it can only hold inert
# test fixtures. A real third-party credential (the Amadeus API key) needs a
# backend outside Git. On EKS that is AWS Secrets Manager; on the homelab it is
# this store: ESO's Kubernetes provider reading Secrets that an operator creates
# BY HAND in .Values.kubernetes.sourceNamespace (a bootstrap step, like ghcr-pull;
# see CLAUDE.md, "Bootstrap: homelab source secrets").
#
# Flow: hand-made Secret (external-secrets ns) -> this ClusterSecretStore ->
# ExternalSecret in the app namespace -> Secret owned by ESO -> pod env.
# The app namespace never needs to know where the value came from, exactly as
# with AWS Secrets Manager.
#
# Rendered only when kubernetes.enabled is true (the homelab Application sets
# it). The EKS Application leaves it false.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.kubernetes.serviceAccountName }}
  namespace: {{ .Values.kubernetes.sourceNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Read-only access to Secrets in the source namespace, and nowhere else.
# The ESO controller already reads every Secret in this namespace (its own
# webhook certificates live here), so this grants nothing ESO did not have.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.kubernetes.serviceAccountName }}
  namespace: {{ .Values.kubernetes.sourceNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.kubernetes.serviceAccountName }}
  namespace: {{ .Values.kubernetes.sourceNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.kubernetes.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.kubernetes.serviceAccountName }}
    namespace: {{ .Values.kubernetes.sourceNamespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homelab-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Same reason as the other stores: the CRDs may not be registered yet when
    # ArgoCD runs its first dry-run.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      # Where the hand-made source Secrets live.
      remoteNamespace: {{ .Values.kubernetes.sourceNamespace }}
      server:
        # In-cluster API server; its CA is published in every namespace.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Values.kubernetes.sourceNamespace }}
      auth:
        # ESO requests a short-lived token for this ServiceAccount; no static
        # credential is stored anywhere.
        serviceAccount:
          name: {{ .Values.kubernetes.serviceAccountName }}
          namespace: {{ .Values.kubernetes.sourceNamespace }}
{{- end }}
