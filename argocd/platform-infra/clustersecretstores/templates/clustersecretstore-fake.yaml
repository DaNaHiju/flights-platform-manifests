{{- if .Values.fake.enabled }}
# LOCAL TEST FIXTURE — NOT A SECRET STORE WITH REAL CREDENTIALS.
#
# The values below are inert literals, not credentials. This store exists only so
# the ExternalSecret -> Secret -> envFrom chain can be exercised on the k3s
# homelab, where IRSA (and therefore the AWS store) cannot work. It is never
# applied on AWS: the EKS Application sets fake.enabled=false.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-local
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # The external-secrets.io CRDs may not be registered yet when ArgoCD runs its
    # first dry-run; without this the sync fails on a resource that would be valid
    # one wave later.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    fake:
      data:
        # Keys must match .Values.externalSecrets.remoteKeys in the flights-api
        # chart. db-user value is "flights" so it matches postgresql.auth.username
        # (staging and production connect as the same DB user). The username is
        # not a credential; only db-password is a stand-in for a real secret.
        - key: flights-api/db-user
          value: flights
        - key: flights-api/db-password
          value: not-a-real-credential-local-fixture
{{- end }}
