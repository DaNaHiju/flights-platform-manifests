# Helm values for the kube-prometheus-stack Application
# (argocd/apps/kube-prometheus-stack.yaml).
#
# Educational observability on a single-node homelab with little spare RAM:
# every component has explicit, small requests/limits.

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    retention: 2d
    # Below the 5Gi PVC so Prometheus trims data before the volume fills.
    retentionSize: 2GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # false = select every ServiceMonitor/PodMonitor/PrometheusRule in the
    # cluster, not only those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  # No password in Git: the chart generates a random admin password into the
  # Secret kube-prometheus-stack-grafana. Retrieve it with:
  #   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d; echo
  # The Application ignores /data/admin-password (see ignoreDifferences there).
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
  # Applies to both sidecars (dashboards and datasources). Without it they have
  # no requests or limits.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Disabled for the homelab: the chart's patch job injects the caBundle outside
  # Git, and its field manager cannot be verified without an installed release,
  # so an ignoreDifferences for it would be a guess. Cost: PrometheusRules are
  # no longer validated on admission.
  admissionWebhooks:
    enabled: false
  # The operator's TLS cert/key come from the Secret <release>-admission, which
  # only the admissionWebhooks patch job creates. With the webhooks off nothing
  # creates it, so the pod would stay in ContainerCreating. Serve plain HTTP.
  tls:
    enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

# k3s embeds these control-plane components in a single process, so their
# standard endpoints do not exist and the targets would be falsely DOWN.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# Its headless Service lives in kube-system, which platform-infra does not
# allow as a destination. Cost: no CoreDNS scrape target.
coreDns:
  enabled: false
