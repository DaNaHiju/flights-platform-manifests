# EKS overlay for ArgoCD, applied AFTER infra/helm-values/argocd.yaml (used by both
# the manual bootstrap `helm install` and the self-managing Application
# argocd/eks/apps/argocd.yaml, so the two renders are identical).
#
# Fewer pods: a t3.medium holds at most 17 pods, and the system node group also
# runs Istio, ESO and the AWS controllers. No ApplicationSet (EKS uses plain
# Applications; the chart has no enabled flag for it, so 0 replicas), no
# notifications, no Dex (no SSO).
applicationSet:
  replicas: 0
notifications:
  enabled: false
dex:
  enabled: false

repoServer:
  replicas: 1
server:
  replicas: 1
