# Helm values for the external-secrets Application (argocd/apps/external-secrets.yaml).

# Chart 2.10.0 installs and upgrades the CRDs through the chart when this is true
# (verified: `helm show values external-secrets/external-secrets --version 2.10.0`).
installCRDs: true

serviceAccount:
  create: true
  # IRSA. Left empty here so k3s (no EKS OIDC provider) gets no annotation and
  # the controller uses no AWS auth — correct for the fake ClusterSecretStore.
  #
  # For the EKS run, supply the role ARN as a per-Application parameter override,
  # e.g.:
  #   argocd app set external-secrets \
  #     -p 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::<ACCOUNT_ID>:role/<ROLE>'
  # Never commit an account ID to this repo.
  annotations: {}
